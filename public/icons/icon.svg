<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sword blade -->
    <path d="M256 96 L256 300"/>
    <!-- Guard -->
    <path d="M196 300 L316 300"/>
    <!-- Hilt -->
    <path d="M256 300 L256 372"/>
    <!-- Pommel -->
    <circle cx="256" cy="392" r="20" fill="url(#gold)" stroke="none"/>
  </g>
  <!-- Aura ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.25"/>
</svg>
