<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)" />
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="150" fill="#a855f7" opacity="0.1" />
  <circle cx="1100" cy="530" r="200" fill="#6366f1" opacity="0.1" />
  <circle cx="600" cy="315" r="300" fill="#a855f7" opacity="0.05" />
  
  <!-- Main content -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#text-gradient)">
    Solo Quest
  </text>
  
  <text x="600" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#e2e8f0">
    Transform Your Productivity Into Adventure
  </text>
  
  <!-- Badge -->
  <rect x="450" y="400" width="300" height="60" rx="30" fill="#a855f7" opacity="0.2" stroke="#a855f7" stroke-width="2" />
  <text x="600" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#a855f7">
    🎮 Gamified Productivity
  </text>
  
  <!-- Features -->
  <text x="300" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8">
    Quests • Raids • Progression
  </text>
  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8">
    Social • Analytics • Mobile
  </text>
  <text x="900" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8">
    Subscriptions • Enterprise
  </text>
</svg>