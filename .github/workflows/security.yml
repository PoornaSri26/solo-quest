name: Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Mondays 06:00 UTC — catches new advisories in dependencies.
    - cron: '0 6 * * 1'

jobs:
  npm-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fail on high/critical advisories in production dependencies.
      # Moderate/low findings are reported but do not block CI.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Gitleaks scans the full diff and history for committed credentials
  # (API keys, private keys, tokens). A faster local alternative is:
  #   docker run -v "$PWD:/repo" zricethezav/gitleaks:latest detect -s /repo
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
