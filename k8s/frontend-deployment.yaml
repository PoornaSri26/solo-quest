apiVersion: apps/v1
kind: Deployment
metadata:
  name: solo-quest-frontend
  labels:
    app: solo-quest
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: solo-quest
      component: frontend
  template:
    metadata:
      labels:
        app: solo-quest
        component: frontend
    spec:
      containers:
      - name: frontend
        image: solo-quest-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_API_URL
          value: "http://solo-quest-backend-service:5000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: solo-quest-frontend-service
  labels:
    app: solo-quest
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: solo-quest
    component: frontend
