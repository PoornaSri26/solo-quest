apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solo-quest-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - solo-quest.example.com
    secretName: solo-quest-tls
  rules:
  - host: solo-quest.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: solo-quest-frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: solo-quest-backend-service
            port:
              number: 5000
