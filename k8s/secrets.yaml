apiVersion: v1
kind: Secret
metadata:
  name: solo-quest-secrets
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual secure values in production
  database-url: "postgresql://soloquest:your-secure-password@postgres-service:5432/soloquest"
  jwt-secret: "your-secure-jwt-secret-at-least-16-characters"
  postgres-user: "soloquest"
  postgres-password: "your-secure-postgres-password"
